<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESEA CLINIC · Coming Soon</title>
  <meta name="description" content="The new ESEA CLINIC website is coming soon." />
  <meta name="theme-color" content="#071739" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#071739;
      --deep:#050f25;
      --deep-2:#0d2342;
      --sand:#E9E2D4;
      --gold:#C79A4A;
      --gold-light:#E9D3A0;
      --muted:rgba(233,226,212,.58);
      --muted-2:rgba(233,226,212,.34);
      --line:rgba(233,211,160,.12);
      --gold-gradient:linear-gradient(135deg,#F4E7BE 0%,#E9D3A0 18%,#D5B66D 42%,#9C7A40 78%,#E8D5A0 100%);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--deep)}
    body{
      font-family:Manrope,system-ui,sans-serif;
      color:var(--sand);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .page{
      position:relative;
      min-height:100svh;
      overflow:hidden;
      background:
        radial-gradient(72% 90% at 88% 0%, rgba(25,57,88,.95) 0%, rgba(13,35,66,.95) 28%, rgba(7,23,57,1) 62%, rgba(5,15,37,1) 100%);
      isolation:isolate;
    }

    .page::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.33;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size:72px 72px;
      mask-image:linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
      z-index:0;
    }

    .watermark{
      position:absolute;
      left:-2vw;
      bottom:-8vh;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(180px,34vw,520px);
      line-height:.66;
      font-weight:600;
      letter-spacing:-.07em;
      color:rgba(233,226,212,.024);
      white-space:nowrap;
      pointer-events:none;
      z-index:0;
    }

    .glow,
    .arc,
    .arc-2{
      position:absolute;
      pointer-events:none;
      z-index:0;
    }

    .glow.one{
      right:-180px;
      top:-120px;
      width:480px;
      height:480px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(199,154,74,.18), rgba(199,154,74,.04) 40%, transparent 72%);
      filter:blur(6px);
    }

    .glow.two{
      left:-180px;
      bottom:-180px;
      width:420px;
      height:420px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(91,128,154,.18), rgba(91,128,154,.04) 42%, transparent 74%);
      filter:blur(12px);
    }

    .arc{
      right:-240px;
      top:-120px;
      width:720px;
      height:720px;
      border-radius:50%;
      border:1px solid rgba(233,211,160,.10);
      box-shadow:0 0 0 70px rgba(233,211,160,.02),0 0 0 140px rgba(233,211,160,.012);
    }

    .arc-2{
      right:-110px;
      top:140px;
      width:440px;
      height:440px;
      border-radius:50%;
      border:1px solid rgba(233,211,160,.06);
    }

    .wrap{
      position:relative;
      z-index:2;
      min-height:100svh;
      width:min(1240px, calc(100% - 48px));
      margin:auto;
      display:grid;
      grid-template-columns:1.22fr .78fr;
      gap:56px;
      align-items:center;
      padding:54px 0;
    }

    .left{padding-left:2vw}

    .eyebrow{
      font-size:10px;
      letter-spacing:.42em;
      text-transform:uppercase;
      color:rgba(233,226,212,.44);
      font-weight:600;
    }

    .brand{
      margin-top:18px;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(42px,6vw,78px);
      font-weight:500;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--sand);
    }

    h1{
      margin:28px 0 0;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(80px,12vw,160px);
      font-weight:500;
      line-height:.76;
      letter-spacing:-.048em;
    }

    .soon{
      display:block;
      background:var(--gold-gradient);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      padding-bottom:.08em;
      text-shadow:0 0 46px rgba(199,154,74,.06);
    }

    .line{
      width:min(420px,70vw);
      height:1px;
      margin-top:30px;
      background:linear-gradient(90deg, rgba(199,154,74,.92), transparent);
      position:relative;
    }

    .line::after{
      content:"";
      position:absolute;
      left:0;
      top:50%;
      width:7px;
      height:7px;
      transform:translateY(-50%) rotate(45deg);
      background:var(--gold);
      box-shadow:0 0 14px rgba(199,154,74,.45);
    }

    .copy{
      max-width:560px;
      margin-top:24px;
      color:var(--muted);
      font-size:16px;
      line-height:1.9;
      font-weight:300;
    }


    .panel{
      justify-self:end;
      width:min(100%, 405px);
      padding:36px 0 36px 34px;
      border-left:1px solid rgba(199,154,74,.22);
      background:linear-gradient(90deg, rgba(199,154,74,.045), transparent 70%);
    }

    .panel-note{
      margin:0 0 24px;
      font-size:10px;
      letter-spacing:.30em;
      text-transform:uppercase;
      color:var(--muted-2);
      font-weight:600;
    }

    .svc{
      padding:17px 0;
      border-top:1px solid rgba(233,226,212,.08);
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(233,226,212,.58);
    }

    .svc:last-of-type{border-bottom:1px solid rgba(233,226,212,.08)}

    .info{
      margin-top:34px;
      padding-top:2px;
    }

    .info small{
      display:block;
      margin-bottom:9px;
      font-size:9px;
      letter-spacing:.30em;
      text-transform:uppercase;
      color:rgba(233,226,212,.34);
      font-weight:600;
    }

    .info span{
      display:block;
      font-size:14px;
      color:var(--gold-light);
      word-break:break-word;
    }

    .footer{
      position:absolute;
      left:24px;
      bottom:20px;
      font-size:9px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(233,226,212,.25);
      z-index:2;
    }

    @media (max-width: 850px){
      .wrap{
        grid-template-columns:1fr;
        gap:30px;
        align-content:center;
        padding:78px 0 86px;
      }
      .left{
        padding-left:0;
        text-align:center;
      }
      .brand{font-size:38px}
      h1{font-size:clamp(74px,23vw,114px)}
      .line{
        margin-left:auto;
        margin-right:auto;
        background:linear-gradient(90deg, transparent, rgba(199,154,74,.92), transparent);
      }
      .line::after{
        left:50%;
        transform:translate(-50%,-50%) rotate(45deg);
      }
      .copy{
        margin-left:auto;
        margin-right:auto;
      }
      .panel{
        justify-self:center;
        width:min(100%, 520px);
        border-left:0;
        border-top:1px solid rgba(199,154,74,.20);
        padding:26px 0 0;
        background:none;
        text-align:center;
      }
      .panel-note{display:none}
      .svc{font-size:9px}
      .arc{right:-340px}
      .arc-2{right:-180px; top:220px; width:320px; height:320px}
      .footer{left:0; right:0; text-align:center}
      .watermark{left:50%; transform:translateX(-50%); bottom:-2vh; font-size:clamp(160px,44vw,320px)}
    }

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation:none !important;transition:none !important}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="watermark">ESEA</div>
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="arc"></div>
    <div class="arc-2"></div>

    <div class="wrap">
      <section class="left">
        <div class="eyebrow">Istanbul · Türkiye</div>
        <div class="brand">ESEA CLINIC</div>
        <h1>Coming<span class="soon">Soon.</span></h1>
        <div class="line"></div>
        <p class="copy">A refined new experience is on the way. The new ESEA CLINIC website will be<br>here soon.</p>
      </section>

      <aside class="panel">
        <p class="panel-note">Selected Services</p>
        <div class="svc">Hair Transplant</div>
        <div class="svc">Dental Aesthetics</div>
        <div class="svc">Plastic Surgery</div>
        <div class="info">
          <small>Info</small>
          <span>info@eseaclinicglobal.com</span>
        </div>
      </aside>
    </div>

    <div class="footer">© <span id="y"></span> ESEA CLINIC</div>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
